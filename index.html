<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatik Fragenpool | Pro Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-hover: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.2);
            --error: #ef4444;
            --error-glow: rgba(239, 68, 68, 0.2);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        /* Mac-style Code Block */
        .mac-window {
            background: #000000;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            overflow: hidden;
            margin: 20px 0;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
        }

        .mac-header {
            background: #1e1e1e;
            padding: 10px 15px;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--glass-border);
        }

        .mac-btn {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .mac-close { background: #ff5f56; }
        .mac-min { background: #ffbd2e; }
        .mac-max { background: #27c93f; }

        pre {
            margin: 0;
            padding: 20px;
            overflow-x: auto;
        }

        code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: #e2e8f0;
            line-height: 1.5;
            tab-size: 4;
        }

        /* Syntax Highlighting Colors */
        .kw { color: #c678dd; } /* Keywords */
        .func { color: #61afef; } /* Functions */
        .str { color: #98c379; } /* Strings */
        .num { color: #d19a66; } /* Numbers */
        .comment { color: #7f848e; font-style: italic; }

        h2 {
            font-weight: 600;
            font-size: 1.4rem;
            line-height: 1.5;
            margin-top: 0;
            margin-bottom: 24px;
        }

        .options-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-label {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .option-label:hover {
            background: var(--glass-hover);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateX(4px);
        }

        .option-label input {
            display: none;
        }

        .custom-radio {
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-radius: 50%;
            margin-right: 15px;
            position: relative;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .option-label input:checked + .custom-radio {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .option-label input:checked + .custom-radio::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
        }

        .option-label.selected {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.05);
        }

        .action-btn {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px 32px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 30px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .action-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--text-main);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .action-btn.primary {
            background: var(--accent);
            color: #000;
            border: none;
        }

        .action-btn.primary:hover {
            box-shadow: 0 0 20px var(--accent-glow);
            background: #7dd3fc;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
        }

        .feedback-area {
            margin-top: 24px;
            padding: 20px;
            border-radius: 12px;
            font-weight: 500;
            display: none;
            line-height: 1.5;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .correct-state {
            border-color: var(--success) !important;
            background: var(--success-glow) !important;
        }

        .correct-state .custom-radio { border-color: var(--success); }
        .correct-state .custom-radio::after { background: var(--success); }

        .wrong-state {
            border-color: var(--error) !important;
            background: var(--error-glow) !important;
            opacity: 0.7;
        }

        .wrong-state .custom-radio { border-color: var(--error); }
        .wrong-state .custom-radio::after { background: var(--error); }

        /* Offene Fragen Design */
        .solution-box {
            background: rgba(0,0,0,0.3);
            border-left: 4px solid var(--accent);
            padding: 20px;
            border-radius: 0 12px 12px 0;
            margin-top: 20px;
            display: none;
        }

        .eval-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            display: none;
        }

        .eval-btn {
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255,255,255,0.05);
            color: white;
        }

        .eval-btn.wrong:hover { background: var(--error); border-color: var(--error); }
        .eval-btn.correct:hover { background: var(--success); border-color: var(--success); }
    </style>
</head>
<body>

<div class="glass-panel" id="quiz-container">
    <div class="status-badge" id="progress-badge">Frage 1 / X</div>
    
    <div id="question-content"></div>
    
    <div id="mc-container">
        <ul class="options-list" id="options-list"></ul>
    </div>

    <div id="open-container" style="display: none;">
        <div class="solution-box" id="solution-box">
            <div style="color: var(--accent); font-weight: 600; margin-bottom: 10px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">Offizielle Musterlösung</div>
            <div id="solution-text" style="color: #e2e8f0; font-size: 0.95rem;"></div>
        </div>
        <div class="eval-grid" id="eval-grid">
            <button class="eval-btn wrong" onclick="nextQuestion(false)">Hatte ich falsch</button>
            <button class="eval-btn correct" onclick="nextQuestion(true)">Hatte ich richtig</button>
        </div>
    </div>

    <div id="feedback" class="feedback-area"></div>
    
    <button id="submit-btn" class="action-btn" onclick="checkAnswer()" disabled>Antwort bestätigen</button>
    <button id="next-btn" class="action-btn primary" onclick="nextQuestion(true)" style="display: none;">Nächste Frage ➔</button>
</div>

<script>
    // Funktion zur Code-Hervorhebung (Mini-Syntax-Highlighter für Python)
    function highlightPython(code) {
        return code
            .replace(/\b(def|return|if|elif|else|while|for|in|print|len|max|sum)\b/g, '<span class="kw">$1</span>')
            .replace(/\b([a-zA-Z_]\w*)(?=\()/g, '<span class="func">$1</span>')
            .replace(/(['"].*?['"])/g, '<span class="str">$1</span>')
            .replace(/\b(\d+)\b/g, '<span class="num">$1</span>')
            .replace(/(#.*)/g, '<span class="comment">$1</span>');
    }

    // Hilfsfunktion generiert die Mac-Code-Box
    function getCodeBox(codeString) {
        return `
        <div class="mac-window">
            <div class="mac-header">
                <div class="mac-btn mac-close"></div>
                <div class="mac-btn mac-min"></div>
                <div class="mac-btn mac-max"></div>
            </div>
            <pre><code>${highlightPython(codeString)}</code></pre>
        </div>`;
    }

    // Exakte 1:1 Daten aus den Folien
    const exactQuestions = [
        {
            type: "open",
            question: "Predict the exact output of the program below, then briefly justify each printed value by reference to the heap/stack model. Distinguish carefully between mutating an object through a shared reference and rebinding a local name to a new object." + getCodeBox(`def modify(lst):
    lst.append(4)
    lst = [9, 9]
    lst.append(5)

a = [1, 2, 3]
modify(a)
print(a)
print(len(a))`),
            solution: "• Output: <code>[1, 2, 3, 4]</code> und <code>4</code>.<br>• The first statement <code>lst.append(4)</code> mutates the heap list that both lst (in modify's frame) and a (in the caller's frame) refer to.<br>• The statement <code>lst = [9, 9]</code> rebinds the local name lst to a brand-new list object on the heap.<br>• The subsequent <code>lst.append(5)</code> mutates the new list, which the caller never observes."
        },
        {
            type: "mc",
            question: "The function countdown below has a valid base case, yet may still raise RecursionError. For which call will a RecursionError first occur in CPython with default settings?" + getCodeBox(`def countdown(n):
    if n <= 0:
        return "done"
    return countdown(n - 1)`),
            options: [
                "countdown(100)",
                "countdown(500)",
                "countdown(2000)",
                "Never - the base case halts recursion"
            ],
            correct: 2
        },
        {
            type: "mc",
            question: "The naive recursive Fibonacci implementation below belongs to which complexity class with respect to running time?" + getCodeBox(`def fib(n):
    if n <= 1:
        return n
    return fib(n - 1) + fib(n - 2)`),
            options: ["O(1)", "O(n)", "O(n log n)", "O(2ⁿ)"],
            correct: 3
        },
        {
            type: "mc",
            question: "What is the worst-case time complexity of the following function in terms of n = len(a)?" + getCodeBox(`def f(a):
    n = len(a)
    total = 0
    for i in range(n):
        for j in range(n):
            total += 1
    for k in range(n):
        total += a[k]
    return total`),
            options: ["O(n)", "O(n log n)", "O(n²)", "O(n³)"],
            correct: 2
        },
        {
            type: "mc",
            question: "A student wrote the binary search below. For which input does it incorrectly return -1 even though the target is present?" + getCodeBox(`def buggy_search(a, target):
    lo, hi = 0, len(a) - 1
    while lo < hi:
        mid = (lo + hi) // 2
        if a[mid] == target:
            return mid
        elif a[mid] < target:
            lo = mid + 1      # <-- bug
        else:
            hi = mid - 1
    return -1`),
            options: [
                "a = [], target = 5",
                "a = [5], target = 5",
                "a = [1, 3, 5], target = 3",
                "a = [1, 3, 5], target = 4"
            ],
            correct: 3
        },
        {
            type: "open",
            question: "Trace the standard iterative reversal of the singly linked list <code>1 -> 2 -> 3 -> None</code> using the three-pointer pattern shown below. For each iteration, give the values of prev, curr, and next_node right after <code>next_node = curr.next</code> has run." + getCodeBox(`def reverse_list(head):
    prev = None
    curr = head
    while curr is not None:
        next_node = curr.next
        curr.next = prev
        prev = curr
        curr = next_node
    return prev`),
            solution: "Iter 1: prev=None, curr=1, next_node=2<br>Iter 2: prev=1, curr=2, next_node=3<br>Iter 3: prev=2, curr=3, next_node=None<br>Final return value: prev (which points to the node containing 3)."
        }
    ];

    let currentIndex = 0;
    
    function loadQuestion() {
        const q = exactQuestions[currentIndex];
        document.getElementById('progress-badge').innerText = `Frage ${currentIndex + 1} / ${exactQuestions.length}`;
        document.getElementById('question-content').innerHTML = `<h2>${q.question}</h2>`;
        
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const feedback = document.getElementById('feedback');
        
        submitBtn.style.display = 'block';
        submitBtn.disabled = true;
        nextBtn.style.display = 'none';
        feedback.style.display = 'none';

        if (q.type === 'mc') {
            document.getElementById('mc-container').style.display = 'block';
            document.getElementById('open-container').style.display = 'none';
            submitBtn.innerText = "Antwort bestätigen";
            
            const list = document.getElementById('options-list');
            list.innerHTML = '';
            
            q.options.forEach((opt, idx) => {
                list.innerHTML += `
                    <li>
                        <label class="option-label" id="label-${idx}">
                            <input type="radio" name="answer" value="${idx}" onchange="selectOption(${idx})">
                            <div class="custom-radio"></div>
                            <span>${opt}</span>
                        </label>
                    </li>
                `;
            });
        } else {
            document.getElementById('mc-container').style.display = 'none';
            document.getElementById('open-container').style.display = 'block';
            document.getElementById('solution-box').style.display = 'none';
            document.getElementById('eval-grid').style.display = 'none';
            document.getElementById('solution-text').innerHTML = q.solution;
            
            submitBtn.disabled = false;
            submitBtn.innerText = "Lösung aufdecken";
        }
    }

    function selectOption(index) {
        document.querySelectorAll('.option-label').forEach(el => el.classList.remove('selected'));
        document.getElementById(`label-${index}`).classList.add('selected');
        document.getElementById('submit-btn').disabled = false;
    }

    function checkAnswer() {
        const q = exactQuestions[currentIndex];
        const submitBtn = document.getElementById('submit-btn');
        const feedback = document.getElementById('feedback');

        if (q.type === 'mc') {
            const selectedInput = document.querySelector('input[name="answer"]:checked');
            if (!selectedInput) return;
            const answer = parseInt(selectedInput.value);
            
            document.querySelectorAll('input[name="answer"]').forEach(i => i.disabled = true);
            submitBtn.style.display = 'none';
            document.getElementById('next-btn').style.display = 'block';
            feedback.style.display = 'block';

            if (answer === q.correct) {
                document.getElementById(`label-${answer}`).classList.add('correct-state');
                feedback.innerHTML = '🔥 <strong>Perfekt!</strong> Die Laufzeitanalyse ist exakt richtig.';
                feedback.style.background = 'var(--success-glow)';
                feedback.style.border = '1px solid var(--success)';
                feedback.style.color = 'var(--success)';
            } else {
                document.getElementById(`label-${answer}`).classList.add('wrong-state');
                document.getElementById(`label-${q.correct}`).classList.add('correct-state');
                feedback.innerHTML = '⚠️ <strong>Knapp daneben.</strong> Die korrekte Antwort wurde hervorgehoben.';
                feedback.style.background = 'var(--error-glow)';
                feedback.style.border = '1px solid var(--error)';
                feedback.style.color = '#fca5a5';
            }
        } else {
            submitBtn.style.display = 'none';
            document.getElementById('solution-box').style.display = 'block';
            document.getElementById('eval-grid').style.display = 'grid';
        }
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < exactQuestions.length) {
            loadQuestion();
        } else {
            document.getElementById('quiz-container').innerHTML = `
                <div style="text-align: center; padding: 40px 0;">
                    <h2 style="font-size: 2rem; color: var(--accent); margin-bottom: 10px;">Quiz beendet!</h2>
                    <p style="color: var(--text-muted);">Alle Code-Traces erfolgreich abgeschlossen.</p>
                    <button class="action-btn primary" onclick="location.reload()" style="max-width: 200px;">Neu starten</button>
                </div>
            `;
        }
    }

    // Start
    loadQuestion();
</script>
</body>
</html>
